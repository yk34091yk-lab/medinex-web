<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medical Timeline | MediNex</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* ================= PAGE ================= */

        .timeline-page {
            min-height: calc(100vh - 76px);
            background: #f5f9fa;
            padding: 35px 5%;
        }

        .timeline-container {
            max-width: 1050px;
            margin: auto;
        }


        /* ================= HEADER ================= */

        .timeline-header {
            margin-bottom: 25px;
        }

        .timeline-header h1 {
            color: #173b4a;
            font-size: 30px;
            margin-bottom: 7px;
        }

        .timeline-header p {
            color: #718189;
            font-size: 14px;
        }


        /* ================= PATIENT CARD ================= */

        .patient-card {
            background: white;
            border: 1px solid #e1eaec;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px;
        }

        .patient-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .patient-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #e8f5f6;
            color: #087f8c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            font-weight: 800;
        }

        .patient-info h2 {
            color: #173b4a;
            font-size: 17px;
            margin-bottom: 5px;
        }

        .patient-info p {
            color: #718189;
            font-size: 11px;
        }

        .record-count {
            background: #eef9f9;
            color: #087f8c;
            padding: 9px 13px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }


        /* ================= FILTER ================= */

        .filter-card {
            background: white;
            border: 1px solid #e1eaec;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 30px;
        }

        .filter-card label {
            display: block;
            color: #304d58;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            border: 1px solid #d8e5e7;
            background: white;
            color: #536a72;
            padding: 8px 14px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 11px;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: #087f8c;
            border-color: #087f8c;
            color: white;
        }


        /* ================= TIMELINE ================= */

        .timeline {
            position: relative;
            margin-left: 25px;
        }

        .timeline::before {
            content: "";
            position: absolute;
            left: 19px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #d8e8ea;
        }


        /* ================= TIMELINE ITEM ================= */

        .timeline-item {
            position: relative;
            padding-left: 65px;
            margin-bottom: 25px;
        }

        .timeline-dot {
            position: absolute;
            left: 7px;
            top: 5px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #087f8c;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            z-index: 2;
            border: 4px solid #f5f9fa;
        }

        .timeline-card {
            background: white;
            border: 1px solid #e1eaec;
            border-radius: 13px;
            padding: 20px;
        }

        .timeline-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 12px;
        }

        .timeline-title h3 {
            color: #173b4a;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .timeline-title span {
            color: #087f8c;
            font-size: 10px;
            font-weight: 700;
        }

        .timeline-date {
            color: #7b8b91;
            font-size: 10px;
            white-space: nowrap;
        }

        .timeline-content {
            color: #657980;
            font-size: 12px;
            line-height: 1.7;
        }

        .timeline-content strong {
            color: #304d58;
        }


        /* ================= TAGS ================= */

        .timeline-tags {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .timeline-tag {
            background: #eef8f8;
            color: #087f8c;
            padding: 5px 8px;
            border-radius: 5px;
            font-size: 9px;
            font-weight: 700;
        }


        /* ================= EMPTY ================= */

        .empty-timeline {
            background: white;
            border: 1px solid #e1eaec;
            border-radius: 14px;
            padding: 50px 20px;
            text-align: center;
            color: #718189;
        }

        .empty-timeline .empty-icon {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .empty-timeline h3 {
            color: #173b4a;
            margin-bottom: 7px;
        }

        .empty-timeline p {
            font-size: 12px;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 650px) {

            .timeline-page {
                padding: 25px 4%;
            }

            .timeline-header h1 {
                font-size: 25px;
            }

            .patient-card {
                align-items: flex-start;
                flex-direction: column;
            }

            .timeline {
                margin-left: 0;
            }

            .timeline-item {
                padding-left: 45px;
            }

            .timeline::before {
                left: 12px;
            }

            .timeline-dot {
                left: 0;
            }

            .timeline-top {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header class="header">

        <a href="index.html" class="logo">

            <div class="logo-icon">
                M
            </div>

            <div class="logo-text">
                Medi<span>N</span>ex
            </div>

        </a>


        <nav class="navbar">

            <a href="patient-dashboard.html">
                Dashboard
            </a>

            <a href="intake.html">
                Case Taking
            </a>

            <a href="timeline.html">
                Medical Timeline
            </a>

            <a href="upload.html">
                Documents
            </a>

        </nav>


        <button class="menu-btn" id="menuBtn">
            ☰
        </button>

    </header>



    <!-- ================= MAIN ================= -->

    <main class="timeline-page">

        <div class="timeline-container">


            <!-- HEADER -->

            <div class="timeline-header">

                <h1>
                    Medical Timeline
                </h1>

                <p>
                    View your healthcare history in one
                    chronological timeline.
                </p>

            </div>



            <!-- PATIENT CARD -->

            <div class="patient-card">

                <div class="patient-info">

                    <div
                        class="patient-avatar"
                        id="patientAvatar"
                    >
                        P
                    </div>

                    <div>

                        <h2 id="patientName">
                            Patient
                        </h2>

                        <p>
                            MediNex Patient Record
                        </p>

                    </div>

                </div>


                <div
                    class="record-count"
                    id="recordCount"
                >
                    0 Records
                </div>

            </div>



            <!-- FILTER -->

            <div class="filter-card">

                <label>
                    Filter Medical Records
                </label>

                <div class="filter-buttons">

                    <button
                        class="filter-btn active"
                        onclick="filterTimeline('all', this)"
                    >
                        All
                    </button>

                    <button
                        class="filter-btn"
                        onclick="filterTimeline('consultation', this)"
                    >
                        Consultations
                    </button>

                    <button
                        class="filter-btn"
                        onclick="filterTimeline('symptoms', this)"
                    >
                        Symptoms
                    </button>

                    <button
                        class="filter-btn"
                        onclick="filterTimeline('prescription', this)"
                    >
                        Prescriptions
                    </button>

                    <button
                        class="filter-btn"
                        onclick="filterTimeline('document', this)"
                    >
                        Documents
                    </button>

                </div>

            </div>



            <!-- TIMELINE -->

            <div
                class="timeline"
                id="timeline"
            ></div>


        </div>

    </main>



    <!-- ================= JAVASCRIPT ================= -->

    <script>


        /* ================= PATIENT DATA ================= */

        const caseData =
            JSON.parse(
                localStorage.getItem(
                    "medinexCaseData"
                )
            );


        if (caseData && caseData.patientName) {

            document.getElementById(
                "patientName"
            ).textContent =
                caseData.patientName;


            document.getElementById(
                "patientAvatar"
            ).textContent =
                caseData.patientName
                    .charAt(0)
                    .toUpperCase();

        }



        /* ================= CREATE RECORDS ================= */

        function createRecords() {

            let records = [];


            /*
             * Case-taking record
             */

            if (caseData) {

                records.push({

                    type: "consultation",

                    title:
                        "Patient Case Submitted",

                    label:
                        "Initial Consultation",

                    date:
                        caseData.submittedAt
                            ? new Date(
                                caseData.submittedAt
                              ).toLocaleDateString()
                            : "Recently",

                    content: `
                        <strong>Main Symptoms:</strong>
                        ${caseData.symptoms || "Not provided"}
                        <br>

                        <strong>Severity:</strong>
                        ${caseData.severity || "Not provided"}
                        <br>

                        <strong>Duration:</strong>
                        ${caseData.duration || "Not provided"}
                    `,

                    tags: [
                        "Case Taking",
                        "Consultation"
                    ]

                });


                /*
                 * Symptoms record
                 */

                records.push({

                    type: "symptoms",

                    title:
                        "Reported Symptoms",

                    label:
                        "Patient Report",

                    date:
                        caseData.submittedAt
                            ? new Date(
                                caseData.submittedAt
                              ).toLocaleDateString()
                            : "Recently",

                    content: `
                        ${caseData.symptoms || "No symptoms recorded."}
                    `,

                    tags: [
                        "Symptoms"
                    ]

                });


                /*
                 * Medical history
                 */

                records.push({

                    type: "consultation",

                    title:
                        "Medical History Added",

                    label:
                        "Health Information",

                    date:
                        caseData.submittedAt
                            ? new Date(
                                caseData.submittedAt
                              ).toLocaleDateString()
                            : "Recently",

                    content: `
                        <strong>Blood Group:</strong>
                        ${caseData.bloodGroup || "Not provided"}
                        <br>

                        <strong>Allergies:</strong>
                        ${caseData.allergies || "None recorded"}
                        <br>

                        <strong>Family History:</strong>
                        ${caseData.familyHistory || "None recorded"}
                    `,

                    tags: [
                        "Medical History"
                    ]

                });

            }


            /*
             * Uploaded documents
             */

            const documents =
                JSON.parse(
                    localStorage.getItem(
                        "medinexDocuments"
                    )
                ) || [];


            documents.forEach(function(doc) {

                records.push({

                    type: "document",

                    title:
                        doc.name,

                    label:
                        doc.type,

                    date:
                        doc.date,

                    content: `
                        Medical document uploaded
                        successfully.
                        <br>

                        <strong>Type:</strong>
                        ${doc.type}
                        <br>

                        <strong>Size:</strong>
                        ${doc.size}
                    `,

                    tags: [
                        "Document",
                        doc.type
                    ]

                });

            });


            return records;

        }



        /* ================= DISPLAY ================= */

        function displayTimeline(
            filter = "all"
        ) {

            const timeline =
                document.getElementById(
                    "timeline"
                );


            let records =
                createRecords();


            if (filter !== "all") {

                records =
                    records.filter(
                        record =>
                            record.type === filter
                    );

            }


            document.getElementById(
                "recordCount"
            ).textContent =
                records.length +
                (records.length === 1
                    ? " Record"
                    : " Records");


            if (records.length === 0) {

                timeline.innerHTML = `

                    <div class="empty-timeline">

                        <div class="empty-icon">
                            📋
                        </div>

                        <h3>
                            No Medical Records
                        </h3>

                        <p>
                            Your medical records will
                            appear here after consultation
                            or document submission.
                        </p>

                    </div>

                `;

                return;

            }


            timeline.innerHTML = "";


            records.forEach(function(record) {

                let icon = "●";


                if (
                    record.type ===
                    "consultation"
                ) {
                    icon = "🩺";
                }

                if (
                    record.type ===
                    "symptoms"
                ) {
                    icon = "♥";
                }

                if (
                    record.type ===
                    "prescription"
                ) {
                    icon = "💊";
                }

                if (
                    record.type ===
                    "document"
                ) {
                    icon = "📄";
                }


                const tags =
                    record.tags
                        .map(
                            tag =>
                                `<span class="timeline-tag">${tag}</span>`
                        )
                        .join("");


                timeline.innerHTML += `

                    <div class="timeline-item">

                        <div class="timeline-dot">
                            ${icon}
                        </div>


                        <div class="timeline-card">

                            <div class="timeline-top">

                                <div class="timeline-title">

                                    <h3>
                                        ${record.title}
                                    </h3>

                                    <span>
                                        ${record.label}
                                    </span>

                                </div>


                                <div class="timeline-date">
                                    ${record.date}
                                </div>

                            </div>


                            <div class="timeline-content">

                                ${record.content}

                            </div>


                            <div class="timeline-tags">

                                ${tags}

                            </div>

                        </div>

                    </div>

                `;

            });

        }



        /* ================= FILTER ================= */

        function filterTimeline(
            filter,
            button
        ) {

            document
                .querySelectorAll(".filter-btn")
                .forEach(
                    btn =>
                        btn.classList.remove(
                            "active"
                        )
                );


            button.classList.add(
                "active"
            );


            displayTimeline(filter);

        }



        /* ================= MOBILE MENU ================= */

        const menuBtn =
            document.getElementById(
                "menuBtn"
            );

        const navbar =
            document.querySelector(
                ".navbar"
            );


        if (menuBtn && navbar) {

            menuBtn.addEventListener(
                "click",
                function() {

                    navbar.classList.toggle(
                        "active"
                    );


                    menuBtn.textContent =
                        navbar.classList.contains(
                            "active"
                        )
                            ? "✕"
                            : "☰";

                }
            );

        }



        /* ================= INITIAL ================= */

        displayTimeline();


    </script>

</body>

</html>
